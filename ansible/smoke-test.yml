---
# Throwaway playbook used to validate that a playbook-deployment system can reach a
# host and run tasks on it. Does nothing but leave evidence that it ran.
- name: Ansible deployment smoke test
  hosts: "{{ target_hosts | default('all') }}"
  become: false
  gather_facts: true

  vars:
    smoke_test_file: "~/ansible-smoke-test.txt"

  tasks:
    - name: Drop the smoke test marker file
      ansible.builtin.copy:
        dest: "{{ smoke_test_file }}"
        mode: "0644"
        content: |
          Ansible smoke test succeeded.
          timestamp_utc: {{ ansible_facts['date_time']['iso8601'] }}
          inventory_hostname: {{ inventory_hostname }}
          fqdn: {{ ansible_facts['fqdn'] }}
          remote_user: {{ ansible_facts['user_id'] }}
          python: {{ ansible_playbook_python }}

    - name: Read the marker file back
      ansible.builtin.slurp:
        src: "{{ smoke_test_file }}"
      register: smoke_test_marker

    - name: Report the result
      ansible.builtin.debug:
        msg: "{{ (smoke_test_marker.content | b64decode).splitlines() }}"
